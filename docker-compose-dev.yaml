networks:
  orochi-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1420"

# Named volumes — persist entire /home/agent per container across down/up
# First start: Docker seeds volume from image content (zshrc, oh-my-zsh, claude CLI, etc.)
# Subsequent starts: volume content used as-is (all user changes, claude auth, apt installs preserved)
volumes:
  dev-1-home:
  dev-2-home:
  dev-3-home:
  dev-4-home:
  dev-5-home:
  dev-6-home:
  dev-7-home:
  dev-8-home:
  dev-9-home:
